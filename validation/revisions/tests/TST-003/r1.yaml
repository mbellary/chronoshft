preconditions:
- Fixed capacity N; at least four complete physical ring traversals; supported index-width configuration
  recorded.
- Bind the exact input/source/configuration revisions and execution or review method before running;
  unresolved prerequisites are not a pass.
procedure:
- Interleave partial drains, refills and full attempts until the ring wraps repeatedly.
- Compare every observation with a bounded reference deque; separately exercise index rollover if
  a supported reduced-width model is available.
expected:
- Acceptance, empty/full results and consumed sequence match the reference model at every step.
- Physical wraparound preserves capacity and FIFO invariants; unexercised counter rollover is explicitly
  excluded.
oracle:
