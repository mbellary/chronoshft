mandatory: true
preconditions:
- DEC-006 policy, capacity, retry/admission deadline and any replay eligibility are fixed; consumer can
  be stalled deterministically.
- Bind the exact input/source/configuration revisions and execution or review method before running; unresolved
  prerequisites are not a pass.
procedure:
- Fill the queue, stall the consumer and offer additional distinct events.
- Observe each caller-visible result and retained payload while the selected saturation action occurs.
expected:
- Observed blocking, rejection, disconnect or retry action matches the selected policy and its declared
  time/resource bounds.
- No unread event is overwritten and no offer is silently classified as accepted.
oracle:
  kind: independent_reference_comparison
  description: A policy transition table plus an external caller-observation ledger predicts the allowed
    outcomes; elapsed-time checks use the declared deadline boundary.
execution_method: Planned automated procedure for Declared full-queue policy; bind the exact command or
  review checklist and applicable source/fixture revisions before execution.
