schema_version: 1
id: EXP-022
revision: 1
title: Non-destructive TableProvider
validates:
- id: VAL-015
  revision: 2
objective: Establish repeatable, non-destructive scans over retained snapshots.
hypotheses:
- id: HYP-001
  statement: Repeated scans of the same captured table snapshot return identical rows without consuming
    ingestion output.
- id: HYP-002
  statement: Concurrent scans each observe their declared snapshot and preserve retained data until
    all readers release it.
scope: 'VAL-015: repeat and concurrent scan behavior, snapshot capture boundary and retained registry
  semantics.'
exclusions:
- Does not by itself establish full hot/cold visibility or durability.
- A destructive ingestion drain cannot serve as the retained-table oracle.
method:
  kind: executable
  procedure: Run repeated and concurrent queries against an immutable row oracle while ingestion
    advances; delay readers and verify snapshot membership and retention.
  implementation_path: null
dependencies:
- Approved snapshot registry and capture boundary (DEC-003).
- Pinned DataFusion provider APIs and explicit reader leases.
tests: []
completion_criteria:
- Define versioned test specifications with independent oracles and predeclared acceptance criteria
  before execution.
- Execute the defined mandatory investigation and retain outcomes, provenance and integrity-checked
  evidence, including negative and inconclusive results.
- Review hypothesis conclusions and coverage limitations; link a separate validation decision without
  inferring acceptance from experiment completion.
