objective: Establish venue-specific deterministic order-book replay and snapshot/recovery behavior.
hypotheses:
- id: HYP-001
  statement: For each supported venue/feed version, event traces reconstruct the expected book state
    under approved update and ordering rules.
- id: HYP-002
  statement: Gaps, duplicates, reconnect and snapshot/delta recovery yield the declared recovered
    state or explicit invalid-book status.
scope: 'VAL-027: venue event/state rules, deterministic reconstruction oracle and snapshot/recovery
  policy.'
