schema_version: 1
id: EXP-013
revision: 1
title: Reproducible benchmark harness
validates:
- id: VAL-006
  revision: 2
objective: Establish repeatable, workload-qualified benchmark execution and complete result provenance.
hypotheses:
- id: HYP-001
  statement: A recorded run can be reproduced from its pinned source, inputs, command, dependency
    and environment manifests.
- id: HYP-002
  statement: The harness reports correct latency/throughput timing boundaries, raw observations and
    event accounting, including failures and generator shortfalls.
scope: 'VAL-006: harness, workload repeatability, hardware manifests, raw artifacts and valid measurement
  accounting for separately defined profiles.'
exclusions:
- A working harness does not demonstrate any product performance target.
- Keep MVP, reference, burst and additional 5M/s profiles distinct.
method:
  kind: mixed
  procedure: Specify harness inputs and timing/accounting boundaries; check clocks and generators
    with controls; repeat seeded workloads and retain raw observations plus complete provenance.
  implementation_path: null
dependencies:
- Approved profile-specific workload contracts (DEC-005).
- Controlled hardware manifest and raw artifact retention plan.
tests: []
completion_criteria:
- Define versioned test specifications with independent oracles and predeclared acceptance criteria
  before execution.
- Execute the defined mandatory investigation and retain outcomes, provenance and integrity-checked
  evidence, including negative and inconclusive results.
- Review hypothesis conclusions and coverage limitations; link a separate validation decision without
  inferring acceptance from experiment completion.
