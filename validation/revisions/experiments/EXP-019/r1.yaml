- id: VAL-011
  revision: 2
objective: Establish deterministic feed ordering, partition ties, gap/duplicate handling and replay
  rules.
hypotheses:
- id: HYP-001
  statement: Equal-timestamp and cross-partition fixtures produce the order specified by approved
    sequence/tie-break rules.
- id: HYP-002
  statement: Gaps, duplicates and reconnect/replay schedules produce declared accounting and deterministic
    recovered results.
scope: 'VAL-011: sequence/partition/tie-break rules and replay behavior, including cases that disprove
  timestamp-only ordering.'
exclusions:
- No total-order guarantee inferred from nanosecond timestamps.
- Venue-specific rules are not universal feed rules.
method:
  kind: mixed
  procedure: Formalize the ordering contract and independent ordered-event oracle; replay equal-time,
    gap, duplicate and partition-interleaving fixtures.
  implementation_path: null
