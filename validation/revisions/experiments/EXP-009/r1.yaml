schema_version: 1
id: EXP-009
revision: 1
title: Competitor claim verification
validates:
- id: VAL-007
  revision: 2
objective: Qualify competitor feature and performance comparisons against versioned sources and matched
  workloads.
hypotheses:
- id: HYP-001
  statement: Every retained feature comparison is supported for explicitly named product versions
    and configurations.
- id: HYP-002
  statement: Any retained performance comparison uses equivalent workload semantics and reports correctness,
    resources and material limitations for each system.
scope: 'VAL-007: documentary feature audit; executable comparisons only for performance claims that
  remain in scope.'
exclusions:
- No categorical product ranking from a single workload.
- Documentary review alone cannot verify latency/loading comparisons.
method:
  kind: mixed
  procedure: Build a dated claim/source/version matrix; mark unresolved claims unsupported; reproduce
    retained quantitative comparisons under a declared fair workload contract.
  implementation_path: null
dependencies:
- Named products, editions, versions and source snapshots.
- Comparable workload semantics and benchmark access for retained numeric claims.
tests: []
completion_criteria:
- Define versioned test specifications with independent oracles and predeclared acceptance criteria
  before execution.
- Execute the defined mandatory investigation and retain outcomes, provenance and integrity-checked
  evidence, including negative and inconclusive results.
- Review hypothesis conclusions and coverage limitations; link a separate validation decision without
  inferring acceptance from experiment completion.
