schema_version: 1
id: EXP-001
revision: 1
title: Bounded SPSC queue
validates:
- id: VAL-012
  revision: 2
objective: Establish capacity enforcement, FIFO behavior and safe wraparound for an explicitly bounded
  queue.
hypotheses:
- id: HYP-001
  statement: For capacity N, attempts beyond N unread entries return full before any unread entry
    is modified.
- id: HYP-002
  statement: Every accepted event is consumed once in accepted FIFO order across empty/full and wraparound
    transitions.
scope: 'VAL-012: sequential queue invariants, exact capacity and admission-before-write behavior.
  Concurrent publication proof is assigned to EXP-003; sustained saturation policy to EXP-002.'
exclusions:
- Sequential tests alone do not establish concurrency safety.
- No latency or zero-allocation guarantee.
method:
  kind: executable
  procedure: Build a correctness-first bounded queue and compare accepted/consumed identities against
    an independent sequence model over boundary and wraparound schedules.
  implementation_path: null
dependencies:
- Define whether N counts events or batches and the exact usable capacity.
- Approved queue admission boundary and full-result contract (DEC-003/006).
tests: []
completion_criteria:
- Define versioned test specifications with independent oracles and predeclared acceptance criteria
  before execution.
- Execute the defined mandatory investigation and retain outcomes, provenance and integrity-checked
  evidence, including negative and inconclusive results.
- Review hypothesis conclusions and coverage limitations; link a separate validation decision without
  inferring acceptance from experiment completion.
