title: Timestamp correctness
validates:
- id: VAL-010
  revision: 2
objective: Establish bounded timestamp arithmetic and approved epoch/timezone round trips.
hypotheses:
- id: HYP-001
  statement: Supported signed-nanosecond boundary values round-trip exactly under the declared epoch
    and timezone policy.
- id: HYP-002
  statement: Overflow and unsupported conversions produce the declared error behavior without silent
    wrap or precision loss.
scope: 'VAL-010: minimum/maximum representable values, negative epochs, timezone conversion and overflow
  handling.'
exclusions:
- Unit resolution does not establish clock accuracy.
- Timestamp arithmetic does not establish feed ordering.
method:
  kind: executable
  procedure: Use independent timestamp fixtures and checked-arithmetic oracles to exercise signed
    boundaries, units, timezone transitions and invalid conversions.
  implementation_path: null
dependencies:
- Approved epoch, timezone, precision and overflow policy (DEC-007).
