schema_version: 1
id: EXP-001
revision: 3
title: Bounded SPSC queue
validates:
- id: VAL-012
  revision: 4
objective: Establish capacity enforcement, FIFO behavior and safe wraparound for an explicitly bounded
  queue.
hypotheses:
- id: HYP-001
  statement: For capacity N, attempts beyond N unread entries return full before any unread entry is modified.
- id: HYP-002
  statement: Every accepted event is consumed once in accepted FIFO order across empty/full and wraparound
    transitions.
scope: 'VAL-012: sequential queue invariants, exact capacity and admission-before-write behavior. Concurrent
  publication proof is assigned to EXP-003; sustained saturation policy to EXP-002.'
exclusions:
- Sequential tests alone do not establish concurrency safety.
- No latency or zero-allocation guarantee.
- Mutex-backed prototype; no lock-free guarantee, allocator-failure injection, disconnection protocol
  or machine-counter rollover claim.
method:
  kind: executable
  procedure: Execute four sequential Rust integration tests against independent ledgers and VecDeque models;
    retain per-operation reports using the committed capture plan.
  implementation_path: experiments/exp-001-spsc-queue/src/lib.rs
dependencies:
- 'Prototype-only contract fixed in experiments/exp-001-spsc-queue/README.md: individual events; exact
  usable N in 1..=4096; zero/oversized rejected before allocation; full push returns original event before
  slot mutation.'
- This isolated experiment needs no production adoption decision. DEC-003/DEC-006 remain unresolved; EXP-002
  owns overload policy and EXP-003 owns concurrent publication proof.
tests:
- id: TST-001
  revision: 2
- id: TST-002
  revision: 2
- id: TST-003
  revision: 2
- id: TST-004
  revision: 2
completion_criteria:
- Define versioned test specifications with independent oracles and predeclared acceptance criteria before
  execution.
- Execute the defined mandatory investigation and retain outcomes, provenance and integrity-checked evidence,
  including negative and inconclusive results.
- Review hypothesis conclusions and coverage limitations; link a separate validation decision without
  inferring acceptance from experiment completion.
