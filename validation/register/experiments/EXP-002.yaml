schema_version: 1
id: EXP-002
revision: 4
title: Queue overload policy
validates:
- id: VAL-012
  revision: 5
objective: Establish that saturation follows the approved policy and preserves complete event accounting
  through recovery.
hypotheses:
- id: HYP-001
  statement: Under the approved saturation policy, every offered event is classified as accepted, explicitly
    rejected, retried or otherwise accounted for without silent overwrite.
- id: HYP-002
  statement: After a stalled consumer resumes, accepted events drain in order within the declared resource
    and recovery bounds.
scope: 'VAL-012: full-queue action, bounded backlog, retry/rejection semantics, accounting and recovery;
  policy choice requires its own decision.'
exclusions:
- No universal zero-loss promise for arbitrary offered load.
- No product throughput acceptance.
method:
  kind: mixed
  procedure: Review the policy against DEC-006, then drive deterministic saturation, stalled-consumer
    and drain/recovery schedules using an identity ledger and declared bounds.
  implementation_path: null
dependencies:
- Choose overload and retry/replay policy (DEC-006).
- EXP-001 capacity contract and implementation boundary.
tests:
- id: TST-005
  revision: 3
- id: TST-006
  revision: 3
- id: TST-007
  revision: 3
- id: TST-008
  revision: 3
