title: DataFusion projection semantics
validates:
- id: VAL-016
  revision: 3
objective: Establish correct projection planning and schema/results for pinned DataFusion APIs.
hypotheses:
- id: HYP-001
  statement: Reordered and partial projections produce exactly the requested columns, values and
    schema in the requested order.
- id: HYP-002
  statement: Projection is applied according to the pinned provider/execution contract without duplicate
    projection or original-schema mismatch.
scope: 'VAL-016: nontrivial projections, MemoryExec/provider schema agreement and version-dependent
  API behavior.'
exclusions:
- No unqualified assertion that every API version has the same bug.
- Projection correctness does not prove full SQL conformance.
method:
  kind: executable
  procedure: Compare projected queries and plans against an independent column-selection oracle for
    reordered, partial and supported edge-case projections.
  implementation_path: null
dependencies:
