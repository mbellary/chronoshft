schema_version: 1
id: EXP-024
revision: 2
title: Exclusive buffer publication
validates:
- id: VAL-019
  revision: 3
objective: Establish writer exclusion, immutable publication and safe reuse transitions for active-memory
  buffers.
hypotheses:
- id: HYP-001
  statement: Every supported concurrent schedule enforces exclusive mutation before publication and
    prevents append/flush aliasing.
- id: HYP-002
  statement: Buffer state transitions prevent reuse while any declared reader lease remains active.
scope: 'VAL-019: ownership state machine, concurrent-call API restrictions, publication ordering
  and lease/retirement rules.'
exclusions:
- An atomic index flip alone is not an ownership proof.
- Performance is a separate measurement gate.
method:
  kind: mixed
  procedure: Review state-machine and unsafe invariants, specify misuse/concurrent-call schedules,
    and model-check publication/reuse transitions with delayed-reader controls.
  implementation_path: null
dependencies:
- Approved ownership/state-machine alternative (DEC-003).
- Explicit append/flush/reader API and atomic memory model.
