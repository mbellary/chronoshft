schema_version: 1
id: EXP-026
revision: 2
title: Asynchronous query lifetime
validates:
- id: VAL-021
  revision: 3
objective: Establish that buffer retirement follows actual query completion and cancellation, not
  merely callback return.
hypotheses:
- id: HYP-001
  statement: Buffers handed to asynchronous queries remain valid until all query consumers complete
    or release their leases.
- id: HYP-002
  statement: Cancellation, failure and delayed-consumer schedules release or retain leases according
    to the declared retirement protocol without premature reuse.
scope: 'VAL-021: handoff-to-query lifetime boundary, slow readers, cancellation, failure and retirement
  barriers.'
exclusions:
- Callback completion is not assumed to mean query completion.
- Does not establish the signaling latency target.
method:
  kind: mixed
  procedure: Instrument leases across callback handoff, asynchronous execution and cancellation;
    drive delayed-reader schedules and inspect retirement against query-lifetime oracles.
  implementation_path: null
dependencies:
- Approved query lease/retirement contract (DEC-003).
- Pinned DataFusion asynchronous execution/cancellation APIs.
tests:
- id: TST-076
  revision: 1
- id: TST-077
  revision: 1
- id: TST-078
  revision: 1
