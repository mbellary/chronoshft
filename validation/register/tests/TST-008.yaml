procedure:
- Review selected block/reject/retry/disconnect behavior against event-accounting and consumer-stall requirements.
- Fix queue bounds, retry deadlines, loss disposition and recovery conditions before automated execution.
expected:
- The selected policy explicitly defines every offer outcome and bounded recovery/resource envelope.
- Pending DEC-006 approval or unspecified bounds prevent execution readiness and positive policy acceptance.
