schema_version: 1
id: TST-003
revision: 3
title: Repeated wraparound and partial drains
experiment:
  id: EXP-001
  revision: 4
validations:
- id: VAL-012
  revision: 5
hypothesis_ids:
- HYP-001
- HYP-002
classification: correctness
execution_type: automated
mandatory: true
preconditions:
- N in [1,3,4,7,32]; 16 full/partial-drain rounds followed by 512 deterministic actions with seed 24301.
  Require at least four complete write traversals at each N; record native usize width. Bounded slot indexes
  have no monotonic-counter rollover claim.
- Use committed source, Cargo.lock, prototype contract, tests and capture plan; capture native index width
  and actual compiler/package-manager versions. No production policy approval or concurrency conclusion
  is asserted.
procedure:
- Interleave partial drains, refills and full attempts until the ring wraps repeatedly.
- Compare every observation with a bounded reference deque; separately exercise index rollover if a supported
  reduced-width model is available.
expected:
- Acceptance, empty/full results and consumed sequence match the reference model at every step.
- Physical wraparound preserves capacity and FIFO invariants; unexercised counter rollover is explicitly
  excluded.
oracle:
  kind: independent_reference_comparison
  description: An independently maintained bounded deque predicts each operation result; physical slot
    positions are not used by the oracle.
execution_method: Execute the exact bound Rust integration test from the repository root; CHRONOSHFT_REPORT_DIR=target/validation-reports
  is resolved from that root by the test harness. Retain stdout, stderr and the corresponding TST report.
execution_binding:
  state: bound
  implementation_path: experiments/exp-001-spsc-queue/tests/queue_contracts.rs
  entrypoint: cargo run --offline --locked -p chronoshft-lab -- experiment run-case wraparound_partial_drains
required_evidence:
- Per-case test outcomes including failures, skips and tool errors
- Registry/test revision and implementation or documentary source revision
- Exact execution command or review procedure; input/configuration hashes and applicable environment/toolchain
- Retained artifact references with SHA-256 digests
- Operation trace and seed
- Wrap count and reference comparisons
- Counter-rollover coverage limits
