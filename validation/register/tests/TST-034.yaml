mandatory: true
preconditions:
- Candidate hot-path stages, ownership changes and proposed resource/latency budgets documented.
- Bind the exact input/source/configuration revisions and execution or review method before running;
  unresolved prerequisites are not a pass.
procedure:
- Enumerate decode, append, rotate, registry, destruction and relevant I/O/scheduler work inside/outside
  timing boundaries.
- Record adopted numeric allocation, deallocation, page-fault and latency budgets before measurement.
expected:
- Every retained bounded-path claim has exact endpoints and resource budgets.
- Deferred destruction or excluded work is disclosed rather than silently omitted.
oracle:
  kind: independent_review
  description: An independently drawn event-lifecycle/cost map and approved budget contract define
    the measurement boundary.
execution_method: Planned manual procedure for Hot-path budget and boundary review; bind the exact
  command or review checklist and applicable source/fixture revisions before execution.
