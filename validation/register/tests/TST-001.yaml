preconditions:
- Fixed usable capacity N >= 2; distinct event identities and an empty queue.
- Bind the exact input/source/configuration revisions and execution or review method before running;
  unresolved prerequisites are not a pass.
procedure:
- Alternate accepted inserts and consumes below capacity, including empty-to-nonempty transitions.
- Drain the queue and compare the complete identity sequence with the accepted-input ledger.
expected:
- Consumed identities equal the accepted sequence exactly, with no missing, repeated or reordered
  entries.
- Polling after drain reports empty and does not advance accounting.
