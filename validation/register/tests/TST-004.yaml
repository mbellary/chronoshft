schema_version: 1
id: TST-004
revision: 2
title: Invalid and boundary capacity configuration
experiment:
  id: EXP-001
  revision: 3
validations:
- id: VAL-012
  revision: 4
hypothesis_ids:
- HYP-001
classification: correctness
execution_type: automated
mandatory: true
preconditions:
- 'Prototype constructor contract: events, exact usable N, integers 1..=4096 including non-powers-of-two;
  zero -> Zero, larger sizes -> TooLarge before allocation; reservation errors -> AllocationFailed. Allocation
  failure injection excluded.'
- Use committed source, Cargo.lock, prototype contract, tests and capture plan; capture native index width
  and actual compiler/package-manager versions. No production policy approval or concurrency conclusion
  is asserted.
procedure:
- Request [0,1,2,3,4096,4097,usize::MAX]; compare outcomes to independently fixed bounds 1..=4096 and
  explicit error categories; non-power-of-two 3 is valid.
- Fill each valid queue to its declared usable capacity and exercise one extra insertion.
expected:
- Zero and oversized capacities fail with their declared errors before slot allocation; tests do not inject
  allocator exhaustion. Bounded slot indexes wrap without unbounded counter arithmetic.
- Every accepted configuration reports and enforces its exact usable capacity; arithmetic is checked at
  size boundaries.
oracle:
  kind: independent_reference_comparison
  description: A standalone checked-integer capacity calculation and constructor contract classify each
    input independently of implementation validation helpers.
execution_method: Execute the exact bound Rust integration test from the repository root; CHRONOSHFT_REPORT_DIR=target/validation-reports
  is resolved from that root by the test harness. Retain stdout, stderr and the corresponding TST report.
execution_binding:
  state: bound
  implementation_path: experiments/exp-001-spsc-queue/tests/queue_contracts.rs
  entrypoint: python3 scripts/run_exp001_test.py capacity_configuration
required_evidence:
- Per-case test outcomes including failures, skips and tool errors
- Registry/test revision and implementation or documentary source revision
- Exact execution command or review procedure; input/configuration hashes and applicable environment/toolchain
- Retained artifact references with SHA-256 digests
- Constructor outcome matrix
- Size/arithmetic boundary assertions
