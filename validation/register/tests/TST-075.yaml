preconditions:
- Pool size, allocation budget, reader retention schedule and exhaustion policy fixed.
- Bind the exact input/source/configuration revisions and execution or review method before running;
  unresolved prerequisites are not a pass.
procedure:
- Force delayed readers past normal reuse cycles and observe allocation/reclamation.
- Release readers, drain work and compare reclaimed storage and resource counts with the policy.
expected:
- Storage reuse occurs only after its final protected reader releases it.
- Allocation, memory and exhaustion outcomes meet declared bounds; excess retained memory is not
  hidden.
