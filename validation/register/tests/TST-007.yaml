  revision: 5
hypothesis_ids:
- HYP-002
classification: reliability
execution_type: automated
mandatory: true
preconditions:
- Consumer pause duration, backlog bound, recovery deadline and repeated-burst schedule are declared.
- Bind the exact input/source/configuration revisions and execution or review method before running; unresolved
  prerequisites are not a pass.
procedure:
- Apply a saturation burst, resume consumption and measure backlog until drain.
- Repeat the burst/recovery cycle with new identities and verify later normal admission.
expected:
- Accepted identities drain in the declared order without loss or duplication.
- Backlog, memory and recovery time remain within the declared limits on every cycle; later traffic is
  not permanently blocked.
oracle:
  kind: independent_reference_comparison
  description: The accepted-event ledger predicts drain membership/order; an external monotonic timer
    and configured capacity/resource envelope bound recovery.
execution_method: Planned automated procedure for Drain and recovery after overload; bind the exact command
  or review checklist and applicable source/fixture revisions before execution.
