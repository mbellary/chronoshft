mandatory: true
preconditions:
- Reviewed matched workload, correctness oracle, versions, repetition count and comparison criteria
  fixed.
- Bind the exact input/source/configuration revisions and execution or review method before running;
  unresolved prerequisites are not a pass.
procedure:
- Execute both systems on the declared workload and validate results.
- Retain failures/resources/raw timings and compute the retained comparative claim from paired observations.
expected:
- Both result sets satisfy the independent correctness oracle.
- Any retained performance claim meets its predeclared comparison and reports uncertainty, resources
  and excluded conditions.
oracle:
  kind: independent_reference_comparison
  description: A system-neutral expected result and separate analysis of paired raw measurements
    compute comparison metrics without using either system as the other system oracle.
execution_method: Planned automated procedure for Reproducible paired benchmark; bind the exact command
  or review checklist and applicable source/fixture revisions before execution.
