preconditions:
- Concurrent scan semantics, captured snapshots and independent row oracle fixed.
- Bind the exact input/source/configuration revisions and execution or review method before running;
  unresolved prerequisites are not a pass.
procedure:
- Start overlapping scans with varied scheduling and new ingestion between capture points.
- Compare each scan against its own snapshot rather than combining disjoint scan outputs.
expected:
- Every scan independently returns the complete dataset declared for its snapshot.
- Concurrent scans do not destructively divide data or alter another scan result.
