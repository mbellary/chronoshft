preconditions:
- Dataset sizes, codec settings, byte boundaries, CPU accounting, baseline and numeric claim thresholds
  predeclared.
- Bind the exact input/source/configuration revisions and execution or review method before running;
  unresolved prerequisites are not a pass.
procedure:
- Measure encode/decode CPU and time plus input/output bytes over declared repetitions.
- Retain raw samples and compute compression ratios and CPU deltas against the fixed baseline.
expected:
- Every retained numeric claim meets its declared comparison on all required workloads while round-trip
  correctness holds.
- Nonzero CPU costs, overhead and failed/short runs are reported; unsupported zero-CPU or ratio claims
  are rejected.
oracle:
  kind: independent_reference_comparison
  description: Independent raw-file byte counts and a separate analysis of OS CPU/timing observations
    compute ratios and comparisons against the predeclared baseline.
execution_method: Planned automated procedure for Compression and CPU measurement; bind the exact
  command or review checklist and applicable source/fixture revisions before execution.
