title: Readiness claim evidence mapping
experiment:
  id: EXP-005
  revision: 2
validations:
- id: VAL-001
  revision: 3
hypothesis_ids:
- HYP-001
classification: documentary
execution_type: manual
mandatory: true
preconditions:
- Versioned readiness wording and explicit reliability/security/correctness criteria available.
- Bind the exact input/source/configuration revisions and execution or review method before running;
  unresolved prerequisites are not a pass.
procedure:
- Inventory every readiness claim and its scope.
- Map each retained claim to independently inspectable evidence and list uncovered criteria.
expected:
- Every retained readiness claim has applicable evidence for each required criterion.
- Missing, stale or out-of-scope evidence blocks the corresponding positive claim.
oracle:
  kind: independent_review
  description: A criteria-by-claim checklist derived from the approved readiness definition, checked
    against artifact contents rather than presence of links alone.
execution_method: Planned manual procedure for Readiness claim evidence mapping; bind the exact command
  or review checklist and applicable source/fixture revisions before execution.
execution_binding:
  state: unbound
  implementation_path: null
  entrypoint: null
required_evidence:
- Review checklist, findings and named reviewer/date
- Registry/test revision and implementation or documentary source revision
- Exact execution command or review procedure; input/configuration hashes and applicable environment/toolchain
- Retained artifact references with SHA-256 digests
- Claim inventory with source locations
- Criterion/evidence matrix and gap list
