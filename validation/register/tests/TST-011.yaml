- id: VAL-013
  revision: 5
hypothesis_ids:
- HYP-001
- HYP-002
classification: documentary
execution_type: manual
mandatory: true
preconditions:
- Complete safe/unsafe API surface and implementation revision available; intended caller schedules and
  atomic model documented.
- Bind the exact input/source/configuration revisions and execution or review method before running; unresolved
  prerequisites are not a pass.
procedure:
- Enumerate mutable access, Send/Sync guarantees, reservation/full checks and publication/reclamation
  edges.
- Trace each unsafe operation to an ownership invariant and its supporting model/test; identify unsupported
  caller schedules.
expected:
- Every unsafe operation has an explicit, applicable exclusion/lifetime/order argument or is recorded
  as an unresolved safety finding.
- A positive safety conclusion is blocked by any unsupported aliasing, full-ring or publication invariant.
oracle:
  kind: independent_review
  description: Rust ownership/memory-model obligations and a separately authored state-machine checklist
    are reviewed against source locations, not implementation comments alone.
execution_method: Planned manual procedure for Unsafe invariants and protocol review; bind the exact command
  or review checklist and applicable source/fixture revisions before execution.
execution_binding:
  state: unbound
  implementation_path: null
  entrypoint: null
required_evidence:
- Review checklist, findings and named reviewer/date
- Registry/test revision and implementation or documentary source revision
- Exact execution command or review procedure; input/configuration hashes and applicable environment/toolchain
- Retained artifact references with SHA-256 digests
- Invariant-to-source/test matrix
- Named review record and unresolved findings
