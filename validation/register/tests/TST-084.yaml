preconditions:
- Disk-full/write-error behavior, retry identity and catalog recovery rules fixed.
- Bind the exact input/source/configuration revisions and execution or review method before running;
  unresolved prerequisites are not a pass.
procedure:
- Inject disk-full, partial write and catalog update failures; retry according to policy.
- Restart repeatedly and compare committed dataset and catalog consistency with the independent commit
  ledger.
expected:
- Errors never produce a false durable acknowledgment.
- Recovered committed data/catalog are consistent and idempotent across retries with no unexplained
  duplicate or missing committed identities.
