classification: documentary
execution_type: manual
mandatory: true
preconditions:
- Resolved source editions and cited claim text available.
- Bind the exact input/source/configuration revisions and execution or review method before running;
  unresolved prerequisites are not a pass.
procedure:
- Read the relevant source passage for each resolved citation.
- Compare the actual supported scope with the assertion and identify overstatement or misattribution.
expected:
- Every retained attribution is supported by the referenced edition/passage within its stated scope.
- Source existence alone cannot pass an unsupported claim.
oracle:
