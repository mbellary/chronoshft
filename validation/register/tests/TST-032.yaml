  description: The archived original source passages and a separately maintained claim-support rubric
    determine attribution validity.
execution_method: Planned manual procedure for Source support and attribution review; bind the exact
  command or review checklist and applicable source/fixture revisions before execution.
execution_binding:
  state: unbound
  implementation_path: null
  entrypoint: null
required_evidence:
- Review checklist, findings and named reviewer/date
- Registry/test revision and implementation or documentary source revision
- Exact execution command or review procedure; input/configuration hashes and applicable environment/toolchain
- Retained artifact references with SHA-256 digests
- Claim-to-passage review matrix
- Unsupported or overstated attribution findings
