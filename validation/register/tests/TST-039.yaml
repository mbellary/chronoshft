preconditions:
- Timing endpoints, percentile algorithm, eligible-event definitions, intended offered rate and control
  fixtures fixed.
- Bind the exact input/source/configuration revisions and execution or review method before running;
  unresolved prerequisites are not a pass.
procedure:
- Feed known timestamp/duration samples and deliberately short-rate, dropped, duplicate, rejected
  and timed-out cases to the harness.
- Recompute distributions and reconcile offered, accepted, visible and, when in scope, durable identities
  after drain.
expected:
- Reported percentiles and elapsed intervals match the independent control calculations.
- Generator shortfall and any nonzero eligible-event loss are non-passes for the corresponding target;
  no rounded percentage hides a missing identity.
oracle:
