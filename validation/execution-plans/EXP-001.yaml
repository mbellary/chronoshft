schema_version: 1
run_id: RUN-exp001-rust-001
experiment:
  id: EXP-001
  revision: 4
  registry_commit: HEAD
implementation_commit: HEAD
working_directory: .
toolchain_command:
- cargo
- run
- --offline
- --locked
- -p
- chronoshft-lab
- --
- toolchain
- show
configuration: Sequential debug-profile prototype. Capacities 1..4096 events; mutex-backed ring; prototype
  has no external Rust dependencies; tooling dependencies locked in root Cargo.lock; offline locked Cargo.
  No performance acceptance. Reports include operation traces, constructor matrix and native index width.
deviations: []
inputs:
- name: prototype contract
  path: experiments/exp-001-spsc-queue/README.md
- name: independent model and schedules
  path: experiments/exp-001-spsc-queue/tests/queue_contracts.rs
- name: build and single-case runner
  path: crates/chronoshft-lab/src/experiment.rs
dependency_lockfiles:
- Cargo.lock
random_seeds:
- '24301'
instrumentation: Rust assertions, independent VecDeque/identity ledgers, per-operation text reports, captured
  stdout/stderr and actual rustc/cargo versions.
timeout_seconds: 180
retention: repository
max_repository_artifact_bytes: 2000000
tests:
- id: TST-001
  revision: 3
  command:
  - cargo
  - run
  - --offline
  - --locked
  - -p
  - chronoshft-lab
  - --
  - experiment
  - run-case
  - fifo_exactly_once
  failure_exit_codes:
  - 101
  artifacts:
  - path: target/validation-reports/TST-001.txt
    kind: test_report
- id: TST-002
  revision: 3
