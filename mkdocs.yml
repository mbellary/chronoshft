site_name: ChronosHFT
site_description: Research, architecture and engineering documentation for a financial time-series database and analytics engine.
site_url: https://mbellary.github.io/chronoshft/
repo_url: https://github.com/mbellary/chronoshft
repo_name: mbellary/chronoshft
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/chart-timeline-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Research & governance:
      - "Research baseline": 00-governance/research-baseline.md
      - "Research assessment": 00-governance/research-assessment.md
      - "Research extraction matrix": 00-governance/research-extraction.md
      - "Technical validation": 00-governance/technical-validation.md
      - "Performance profiles": 00-governance/performance-profiles.md
      - "Assumptions & gaps": 00-governance/assumptions-and-gaps.md
      - "Decision register": 00-governance/decision-register.md
      - "Traceability": 00-governance/traceability.md
      - "Readiness & handoff": 00-governance/readiness-and-handoff.md
  - Product:
      - "Phase 2 overview": 01-product/phase-2-definition.md
      - "Market landscape & FDAP": 01-product/market-landscape-and-fdap.md
      - "Product requirements": 01-product/product-requirements.md
      - "Product architecture": 01-product/product-architecture.md
      - "Scope & MVP": 01-product/scope-and-mvp.md
      - "Benchmark targets": 01-product/benchmark-targets.md
      - "Source-to-product traceability": 01-product/product-traceability.md
      - "Open-decision handoff": 01-product/product-decision-handoff.md
