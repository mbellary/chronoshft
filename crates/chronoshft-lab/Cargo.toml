[package]
name = "chronoshft-lab"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
jsonschema = { version = "0.58.6", default-features = false, features = ["arbitrary-precision"] }
yaml-rust2 = { version = "0.13.0", default-features = false }
regex = "1.13.1"
sha2 = "0.10.9"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
num-bigint = "0.4"
html5ever = "0.40.1"
url = "2.5.8"
percent-encoding = "2.3.2"
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["process", "signal"] }
signal-hook = "0.3.18"
